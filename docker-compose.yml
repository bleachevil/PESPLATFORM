services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pesdata
      POSTGRES_USER: pesdata
      POSTGRES_PASSWORD: pesdata
    ports:
      - "5432:5432"
    volumes:
      - pesdata_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesdata -d pesdata"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://pesdata:pesdata@db:5432/pesdata
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_APP_CLIENT_IDS: ${GOOGLE_APP_CLIENT_IDS:-}
    env_file:
      - data/google_oauth.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pesdata_pg:
